name: holberton-revision-accounts

# Déploiement en staging : ne pas router /api/ dans Nginx avant validation.
# Dossiers appartenant à l'UID/GID 1000 (utilisateur node) et droits 0700.
services:
  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: holberton-accounts:local
    restart: unless-stopped
    env_file:
      - /etc/holberton-revision/accounts.env
    environment:
      HBTN_BIND_HOST: 0.0.0.0
      HBTN_CONTAINER_ONLY: "1"
      HBTN_TRUST_LOCAL_PROXY: "1"
      HBTN_DB_PATH: /data/accounts.sqlite
      HBTN_PORT: "3024"
    ports:
      - "127.0.0.1:3024:3024"
    volumes:
      - /opt/holberton-revision/accounts/data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 80
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3024/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  snapshot:
    image: node:22.15.0-bookworm-slim
    profiles: ["maintenance"]
    user: "1000:1000"
    command: ["node", "/tools/snapshot.mjs", "create"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - /opt/holberton-revision/accounts/data:/data:rw
      - /opt/holberton-revision/accounts-backup/work:/backup:rw
      - ../../server/snapshot.mjs:/tools/snapshot.mjs:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
