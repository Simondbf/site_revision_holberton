name: Vérifier Holberton Révision

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier les cours et le JavaScript
        run: |
          node scripts/verifier_site.mjs
          node scripts/verifier_visuels.mjs
          node scripts/verifier_contenu.mjs
          node scripts/verifier_securite.mjs
          node scripts/verifier_pointeurs_fonctions.mjs
          node scripts/verifier_arguments_main.mjs
          node scripts/verifier_fonctions_variadiques.mjs
          node scripts/verifier_controle_flux.mjs
          node scripts/verifier_formats_atoi.mjs
          node scripts/verifier_navigation_compte_quiz.mjs
          node scripts/verifier_quiz.mjs
          node --check quiz/core.mjs
          node --check quiz/engine.mjs
          node scripts/integrer_quiz_html.mjs --check
          node --check account/client.mjs
          node --check server/app.mjs
          node --check server/index.mjs
          node --test server/auth.test.mjs
          bash -n deployment/accounts/backup-now.sh
          bash -n deployment/accounts/restic-docker.sh
          bash -n deployment/accounts/restic-restore-check.sh
          node scripts/preparer_publication.mjs
          bash -n deploiement/verifier_ci_main.sh
          bash -n deploiement/publier_statique.sh

      - name: Conserver les ressources statiques vérifiées
        uses: actions/upload-artifact@v4
        with:
          name: site-statique-a-valider
          path: publication/
          if-no-files-found: error
          retention-days: 7
